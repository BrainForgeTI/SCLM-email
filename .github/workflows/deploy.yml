name: Recreate Develop and Deploy to EB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-to-eb:
    name: Deploy Docker App to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Compress application for EB
        run: |
          mkdir -p bundle/.platform
          cp -r dist package*.json bundle/
          cp -r .platform/* bundle/.platform/ 2>/dev/null || true
          cd bundle
          zip -r ../deploy.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.S3_BUCKET }}/deploy-${{ github.sha }}.zip

      - name: Set version label
        run: echo "VERSION_LABEL=v-${{ github.sha }}-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --source-bundle S3Bucket="${{ secrets.S3_BUCKET }}",S3Key="deploy-${{ github.sha }}.zip"

      - name: Deploy new version to EB
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENV_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}"

  recreate-develop-branch:
    name: Recreate Develop Branch from Main
    runs-on: ubuntu-latest
    needs: deploy-to-eb

    steps:
      - name: Checkout main
        uses: actions/checkout@v3

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Recreate develop branch from main
        run: |
          git fetch origin
          git checkout main
          git pull origin main
          git branch -D develop || echo "Branch develop não existe localmente"
          git checkout -b develop
          git push origin develop --force
